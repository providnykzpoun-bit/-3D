<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Flappy</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5px;
        }

        .hud {
            width: 100%;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .hud-btns {
            display: flex;
            gap: 6px;
        }
        .btn-hud {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #ff007f;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            background: rgba(10, 10, 30, 0.7);
            border: 2px solid #00f0ff;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            color: #00f0ff;
            backdrop-filter: blur(5px);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 5px;
            position: relative;
            width: 100%;
            flex: 1;
        }
        
        canvas#flappyCanvas {
            background: rgba(5, 5, 20, 0.9);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            width: 320px;
            height: 400px;
            max-width: 92vw;
            max-height: 65vh;
        }

        .tap-instruction {
            color: #00f0ff;
            font-size: 14px;
            margin-top: 8px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,240,255,0.5);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.96);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            border: 3px solid #fff;
            color: #fff;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255,0,127,0.5);
        }

        .shop-box {
            width: 100%;
            max-width: 320px;
            background: rgba(15, 15, 35, 0.9);
            border: 1px solid #00f0ff;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            max-height: 45vh;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-item-info { text-align: left; }
        .shop-item-title { font-weight: bold; font-size: 13px; color: #fff; }
        .shop-item-cost { font-size: 11px; color: #ffd700; }
        .btn-buy {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-buy.equipped { background: #ff007f; color: #fff; }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-btns">
            <a href="index.html" class="btn-hud">🏠 Меню</a>
            <button class="btn-hud" id="pauseBtn">⏸️</button>
        </div>
        <div class="badge" id="scoreBadge">Рахунок: 0</div>
        <div class="badge" id="coinsBadge" style="border-color: #ffd700; color: #ffd700;">🪙 0</div>
    </div>

    <div class="game-container" id="gameArea">
        <canvas id="flappyCanvas" width="320" height="380"></canvas>
        <div class="tap-instruction">👆 Тисніть будь-де для зльоту!</div>
    </div>

    <!-- Стартове меню -->
    <div class="overlay" id="startMenu">
        <h1 style="color: #ff007f; font-size: 26px; margin-bottom: 5px; text-transform: uppercase; text-shadow: 0 0 10px #ff007f;">Neon Flappy</h1>
        <p style="color: #ffd700; font-weight: bold; font-size: 14px; margin-bottom: 12px;">Монети: <span id="coinsTotal">0</span> 🪙</p>
        
        <button class="btn-main" id="startBtn">ПОЧАТИ ГРУ</button>
        <button class="btn-hud" id="openShopBtn" style="margin-top: 10px; padding: 8px 20px; font-size: 13px; border-color: #00f0ff; color: #00f0ff; width: 220px;">🛒 Магазин скінів</button>
        <button class="btn-hud" id="withdrawBtn" style="margin-top: 6px; padding: 8px 20px; font-size: 13px; border-color: #00ffaa; color: #00ffaa; width: 220px;">📤 Вивести UA Token</button>
        <a href="index.html" class="btn-hud" style="margin-top: 8px; padding: 8px 20px; font-size: 13px; width: 220px;">🏠 В Головне Меню</a>
    </div>

    <!-- Магазин -->
    <div class="overlay hidden" id="shopMenu">
        <h2 style="color: #00f0ff; font-size: 22px; margin-bottom: 4px;">🛒 Магазин скінів</h2>
        <p style="color: #ffd700; font-size: 13px; margin-bottom: 10px;">Монети: <span id="shopCoinsTotal">0</span> 🪙</p>

        <div class="shop-box">
            <div class="shop-item">
                <div class="shop-item-info">
                    <div class="shop-item-title">Неоновий Блакитний</div>
                    <div class="shop-item-cost">Безкоштовно</div>
                </div>
                <button class="btn-buy" id="skinCyanBtn">Обрати</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info">
                    <div class="shop-item-title">Смарагдовий Кібер</div>
                    <div class="shop-item-cost">500 🪙</div>
                </div>
                <button class="btn-buy" id="skinGreenBtn">Купити</button>
            </div>

            <div class="shop-item">
                <div class="shop-item-info">
                    <div class="shop-item-title">Вогняний Неон</div>
                    <div class="shop-item-cost">1000 🪙</div>
                </div>
                <button class="btn-buy" id="skinRedBtn">Купити</button>
            </div>
        </div>

        <button class="btn-main" id="closeShopBtn" style="padding: 10px 30px; font-size: 14px;">Назад</button>
    </div>

    <!-- Пауза -->
    <div class="overlay hidden" id="pauseMenu">
        <h1 style="color: #00f0ff; font-size: 28px; margin-bottom: 15px;">ПАУЗА</h1>
        <button class="btn-main" id="resumeBtn">Продовжити</button>
        <br><br>
        <a href="index.html" class="btn-hud" style="padding: 10px 20px; font-size: 14px; display: inline-block;">🏠 В Головне Меню</a>
    </div>

    <!-- Програш -->
    <div class="overlay hidden" id="gameOverMenu">
        <h1 style="color: #ff0055; font-size: 26px; margin-bottom: 8px;">СІТКУ ЗБИТО</h1>
        <p id="finalScoreText" style="color: #a5a5c7; margin-bottom: 4px; font-size: 14px;">Рахунок: 0</p>
        <p id="earnedCoinsText" style="color: #ffd700; margin-bottom: 15px; font-weight: bold; font-size: 14px;">Зароблено: +0 🪙</p>
        <button class="btn-main" id="restartBtn">ЗНОВУ</button>
        <br><br>
        <a href="index.html" class="btn-hud" style="padding: 8px 18px; font-size: 13px; display: inline-block; margin-top: 8px;">🏠 В Головне Меню</a>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let coins = parseInt(localStorage.getItem('space_coins') || '0');
        let currentSkin = localStorage.getItem('flappy_skin') || 'cyan';
        let ownedSkins = JSON.parse(localStorage.getItem('flappy_owned_skins') || '["cyan"]');

        function saveGameData() {
            localStorage.setItem('space_coins', coins.toString());
            localStorage.setItem('flappy_skin', currentSkin);
            localStorage.setItem('flappy_owned_skins', JSON.stringify(ownedSkins));
        }

        function updateCoinsUI() {
            document.getElementById('coinsTotal').innerText = coins.toLocaleString();
            document.getElementById('shopCoinsTotal').innerText = coins.toLocaleString();
            document.getElementById('coinsBadge').innerText = `🪙 ${coins}`;
        }
        updateCoinsUI();

        // ВИВІД UA TOKEN
        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const MIN_COINS = 50000;
            const COINS_PER_UA = 1000;

            if (coins < MIN_COINS) {
                alert(`Мінімальна сума для виводу: 50 UA (${MIN_COINS.toLocaleString()} монет)!\nУ вас зараз: ${coins.toLocaleString()} монет.`);
                return;
            }

            let username = 'Гравець';
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                let user = tg.initDataUnsafe.user;
                username = user.username ? `@${user.username}` : `${user.first_name || ''} (ID: ${user.id})`;
            }

            let uaAmount = (coins / COINS_PER_UA).toFixed(1);
            let reportText = `📤 ЗАЯВКА НА ВИВІД UA\n🎮 Гра: Neon Flappy\n👤 Нік: ${username}\n💰 Сума: ${uaAmount} UA (${coins} монет)`;

            navigator.clipboard.writeText(reportText).then(() => {
                alert('Чек виводу сформовано та скопійовано у буфер!\nЗараз ви перейдете в бот: надішліть йому цей текст.');
            }).catch(() => {
                alert(`Ваш чек:\n\n${reportText}\n\nНадішліть його у бот.`);
            });

            coins = 0;
            saveGameData();
            updateCoinsUI();

            if (tg.openTelegramLink) {
                tg.openTelegramLink('http://t.me/tokenpist_bot');
            } else {
                window.open('http://t.me/tokenpist_bot', '_blank');
            }
        });

        // АУДІО
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'score') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.setValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'die') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        const canvas = document.getElementById('flappyCanvas');
        const ctx = canvas.getContext('2d');

        // Ідеальна комфортна фізика
        let bird = { x: 60, y: 180, radius: 14, gravity: 0.22, lift: -4.8, velocity: 0 };
        let pipes = [];
        let score = 0;
        let sessionCoins = 0;
        let isPlaying = false;
        let isPaused = false;
        let frameCount = 0;

        const SKINS = {
            cyan: '#00f0ff',
            green: '#00ff66',
            red: '#ff0033'
        };

        function resetGame() {
            bird.y = 180;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            sessionCoins = 0;
            frameCount = 0;
        }

        function spawnPipe() {
            let gap = 135; // Широкий і зручний прохід
            let minHeight = 50;
            let maxHeight = canvas.height - gap - 50;
            let height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: height,
                bottom: height + gap,
                width: 50,
                passed: false
            });
        }

        function main() {
            if (!isPlaying || isPaused) return;

            frameCount++;
            if (frameCount % 150 === 0) {
                spawnPipe();
            }

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Земля / стеля
            if (bird.y + bird.radius >= canvas.height) {
                gameOver();
                return;
            }
            if (bird.y - bird.radius <= 0) {
                bird.y = bird.radius;
                bird.velocity = 0;
            }

            // Труби
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 1.8;

                // Зіткнення
                if (
                    bird.x + bird.radius > pipes[i].x &&
                    bird.x - bird.radius < pipes[i].x + pipes[i].width &&
                    (bird.y - bird.radius < pipes[i].top || bird.y + bird.radius > pipes[i].bottom)
                ) {
                    gameOver();
                    return;
                }

                // Очки
                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    pipes[i].passed = true;
                    score++;
                    coins += 5;
                    sessionCoins += 5;
                    saveGameData();
                    updateCoinsUI();
                    playSound('score');
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                    document.getElementById('scoreBadge').innerText = `Рахунок: ${score}`;
                }

                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }
            }

            draw();
            requestAnimationFrame(main);
        }

        function draw() {
            ctx.fillStyle = '#050514';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Труби
            ctx.fillStyle = '#ff007f';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff007f';
            pipes.forEach(pipe => {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x, pipe.bottom, pipe.width, canvas.height - pipe.bottom);
            });
            ctx.shadowBlur = 0;

            // Дрон
            ctx.fillStyle = SKINS[currentSkin] || SKINS.cyan;
            ctx.shadowBlur = 12;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function flap() {
            if (!isPlaying || isPaused) return;
            bird.velocity = bird.lift;
            playSound('jump');
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        }

        function startGame() {
            initAudio();
            resetGame();
            isPaused = false;
            isPlaying = true;

            document.getElementById('scoreBadge').innerText = `Рахунок: ${score}`;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('pauseMenu').classList.add('hidden');
            document.getElementById('shopMenu').classList.add('hidden');

            requestAnimationFrame(main);
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            const pauseMenu = document.getElementById('pauseMenu');
            if (isPaused) {
                pauseMenu.classList.remove('hidden');
                document.getElementById('pauseBtn').innerText = '▶';
            } else {
                pauseMenu.classList.add('hidden');
                document.getElementById('pauseBtn').innerText = '⏸️';
                requestAnimationFrame(main);
            }
        }

        function gameOver() {
            isPlaying = false;
            playSound('die');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            document.getElementById('finalScoreText').innerText = `Рахунок: ${score}`;
            document.getElementById('earnedCoinsText').innerText = `Зароблено: +${sessionCoins} 🪙`;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        // МАГАЗИН СКІНІВ
        function refreshShopUI() {
            updateCoinsUI();

            const setupSkin = (btnId, key, cost) => {
                const btn = document.getElementById(btnId);
                if (currentSkin === key) {
                    btn.innerText = 'Обрано';
                    btn.className = 'btn-buy equipped';
                } else if (ownedSkins.includes(key)) {
                    btn.innerText = 'Обрати';
                    btn.className = 'btn-buy';
                    btn.onclick = () => { currentSkin = key; saveGameData(); refreshShopUI(); };
                } else {
                    btn.innerText = 'Купити';
                    btn.className = 'btn-buy';
                    btn.onclick = () => {
                        if (coins >= cost) {
                            coins -= cost;
                            ownedSkins.push(key);
                            currentSkin = key;
                            saveGameData();
                            refreshShopUI();
                        } else alert('Недостатньо монет!');
                    };
                }
            };

            setupSkin('skinCyanBtn', 'cyan', 0);
            setupSkin('skinGreenBtn', 'green', 500);
            setupSkin('skinRedBtn', 'red', 1000);
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        document.getElementById('openShopBtn').addEventListener('click', () => {
            refreshShopUI();
            document.getElementById('shopMenu').classList.remove('hidden');
        });
        document.getElementById('closeShopBtn').addEventListener('click', () => {
            refreshShopUI();
            document.getElementById('shopMenu').classList.add('hidden');
        });

        // Надійний обробник дотиків на весь ігровий контейнер
        document.getElementById('gameArea').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            flap();
        });

        draw();
    </script>
</body>
</html>
