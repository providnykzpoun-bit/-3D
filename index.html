<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя перша 3D гра в Telegram</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Прибирає смуги прокрутки */
            background-color: #000;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Підключаємо Telegram WebApp (щоб гра дружила з Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>

    <!-- Підключаємо Three.js напряму через інтернет (через CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <!-- Наш код гри на Three.js -->
    <script type="module">
        import * as THREE from 'three';

        // 1. Створюємо сцену (наш 3D-простір)
        const scene = new THREE.Scene();

        // 2. Створюємо камеру (очі гравця)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // 3. Створюємо рендерер (те, що малює 3D на екрані)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 4. Створюємо 3D-об'єкт (наприклад, куб)
        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const material = new THREE.MeshNormalMaterial(); // Кольоровий матеріал
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. Функція анімації (крутимо куб кожний кадр)
        function animate() {
            requestAnimationFrame(animate);

            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // Адаптація під зміну розміру екрана смартфона
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
