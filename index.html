<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox Style 3D Obby - Neon Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(to bottom, #1a1c4b, #ff758c);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffeb3b;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255,235,59,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .controls-panel {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 12;
            display: grid;
            grid-template-columns: 65px 65px 65px;
            grid-template-rows: 65px 65px;
            gap: 8px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #00f0ff;
            border-radius: 16px;
            font-size: 26px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0,240,255,0.3);
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:active {
            background: rgba(0, 240, 255, 0.4);
            transform: scale(0.95);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .action-buttons {
            position: absolute;
            bottom: 30px;
            right: 25px;
            z-index: 12;
            pointer-events: auto;
        }
        .jump-btn {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            border: 4px solid #fff;
            border-radius: 50%;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            box-shadow: 0 0 25px rgba(255,0,127,0.6);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .jump-btn:active {
            transform: scale(0.92);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 25, 0.85);
            backdrop-filter: blur(10px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #00f0ff; font-size: 38px; text-shadow: 0 0 20px rgba(0,240,255,0.6); margin-bottom: 10px; text-transform: uppercase; }
        p { color: #d0d0f0; font-size: 16px; margin-bottom: 25px; max-width: 320px; line-height: 1.5; }
        .btn-main {
            background: linear-gradient(45deg, #00f0ff, #7928ca);
            border: 3px solid #fff;
            color: #fff;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0,240,255,0.5);
            text-transform: uppercase;
            pointer-events: auto;
        }
        .btn-main:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud">
        <div class="top-stats">
            <div class="badge" id="stageBadge">Stage 1</div>
            <div class="badge" id="scoreBadge">⭐ 0</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="ctrl-btn btn-up" id="upBtn">⬆️</div>
        <div class="ctrl-btn btn-left" id="leftBtn">⬅️</div>
        <div class="ctrl-btn btn-right" id="rightBtn">➡️</div>
    </div>

    <div class="action-buttons">
        <button class="jump-btn" id="jumpBtn">СТРИБОК</button>
    </div>

    <div class="overlay" id="startMenu">
        <h1>Neon Obby 3D</h1>
        <p>Яскравий світ чекає! Збирайте неонові зірки, долайте перешкоди та переходьте на нові етапи.</p>
        <button class="btn-main" id="startBtn">ПОЧАТИ ГРУ</button>
    </div>

    <div class="overlay hidden" id="gameOverMenu">
        <h1 style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">МІСІЮ ПРОВАЛЕНО</h1>
        <p id="menuText">Ви впали у незвіданість.</p>
        <button class="btn-main" id="restartBtn">СПРОБУВАТИ ЗНОВУ</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0;
        let currentStage = 1;
        let isPlaying = false;

        const playerPos = new THREE.Vector3(0, 1.0, 0);
        let playerVelocityY = 0;
        const gravity = -0.012;
        const jumpForce = 0.28;
        let isGrounded = false;

        let moveForward = false;
        let moveLeft = false;
        let moveRight = false;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Яскраве освітлення
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const pointLight = new THREE.PointLight(0x00f0ff, 2, 50);
        pointLight.position.set(0, 10, 0);
        scene.add(pointLight);

        let platforms = [];
        let stars = [];
        let particles = [];

        // Кольори платформ для неонового стилю
        const platformColors = [0x00f0ff, 0xff007f, 0x7928ca, 0x2ecc71, 0xffeb3b];

        function createLevel() {
            platforms.forEach(p => scene.remove(p));
            stars.forEach(s => scene.remove(s));
            platforms = [];
            stars = [];

            let zPos = 0;
            const totalPlatforms = 20 + (currentStage * 4);

            for (let i = 0; i < totalPlatforms; i++) {
                const width = 3.5;
                const height = 0.6;
                const depth = 3.5;
                
                const col = platformColors[i % platformColors.length];
                const geom = new THREE.BoxGeometry(width, height, depth);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: col, 
                    roughness: 0.2,
                    emissive: col,
                    emissiveIntensity: 0.3
                });
                const platform = new THREE.Mesh(geom, mat);

                let xPos = (i === 0) ? 0 : (Math.random() - 0.5) * (3.5 + currentStage * 0.4);
                if (i === 0) zPos = 0;
                else zPos -= 4.2;

                platform.position.set(xPos, 0, zPos);
                scene.add(platform);
                platforms.push(platform);

                if (i > 0) {
                    const starGeo = new THREE.OctahedronGeometry(0.35);
                    const starMat = new THREE.MeshStandardMaterial({ 
                        color: 0xffeb3b, 
                        emissive: 0xffeb3b, 
                        emissiveIntensity: 0.8,
                        roughness: 0.1
                    });
                    const star = new THREE.Mesh(starGeo, starMat);
                    star.position.set(xPos, 1.1, zPos);
                    scene.add(star);
                    stars.push(star);
                }
            }
        }

        // Персонаж з неоновим ефектом
        const playerGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.4 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), bodyMat);
        body.position.y = 0.3;
        playerGroup.add(body);

        const headMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.5 });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
        head.position.y = 0.75;
        playerGroup.add(head);

        scene.add(playerGroup);

        // Ефект салюту при зборі зірочки
        function createExplosion(x, y, z) {
            for (let i = 0; i < 12; i++) {
                const pGeo = new THREE.SphereGeometry(0.08, 8, 8);
                const pMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
                const particle = new THREE.Mesh(pGeo, pMat);
                particle.position.set(x, y, z);
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 0.05 + Math.random() * 0.08;
                particle.userData = {
                    vx: Math.cos(angle) * speed,
                    vy: (Math.random() - 0.5) * speed + 0.05,
                    vz: Math.sin(angle) * speed,
                    life: 30
                };
                
                scene.add(particle);
                particles.push(particle);
            }
        }

        function bindButton(id, onDown, onUp) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
            btn.addEventListener('pointerleave', (e) => { e.preventDefault(); onUp(); });
        }

        bindButton('upBtn', () => moveForward = true, () => moveForward = false);
        bindButton('leftBtn', () => moveLeft = true, () => moveLeft = false);
        bindButton('rightBtn', () => moveRight = true, () => moveRight = false);

        document.getElementById('jumpBtn').addEventListener('click', () => {
            if (isGrounded && isPlaying) {
                playerVelocityY = jumpForce;
                isGrounded = false;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });

        function startGame() {
            score = 0;
            currentStage = 1;
            document.getElementById('scoreBadge').innerText = `⭐ ${score}`;
            document.getElementById('stageBadge').innerText = `Stage ${currentStage}`;

            playerPos.set(0, 1.0, 0);
            playerVelocityY = 0;
            createLevel();

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            isPlaying = true;
        }

        function gameOver(reason) {
            isPlaying = false;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (isPlaying) {
                const speed = 0.08;
                if (moveForward) playerPos.z -= speed;
                if (moveLeft) playerPos.x -= speed;
                if (moveRight) playerPos.x += speed;

                playerVelocityY += gravity;
                playerPos.y += playerVelocityY;

                let onAnyPlatform = false;
                const platformSurfaceY = 0.25;

                platforms.forEach(p => {
                    if (
                        playerPos.x > p.position.x - 1.8 && playerPos.x < p.position.x + 1.8 &&
                        playerPos.z > p.position.z - 1.8 && playerPos.z < p.position.z + 1.8
                    ) {
                        if (playerVelocityY <= 0 && playerPos.y >= platformSurfaceY && playerPos.y <= platformSurfaceY + 0.6) {
                            playerPos.y = platformSurfaceY + 0.5;
                            playerVelocityY = 0;
                            onAnyPlatform = true;
                        }
                    }
                });

                isGrounded = onAnyPlatform;

                if (playerPos.y < -10) {
                    gameOver();
                }

                // Збір зірок з анімацією
                for (let i = stars.length - 1; i >= 0; i--) {
                    let s = stars[i];
                    s.rotation.y += 0.04;
                    s.position.y = 1.1 + Math.sin(elapsedTime * 4 + i) * 0.15; // плавне гойдання

                    if (playerPos.distanceTo(s.position) < 0.9) {
                        score += 1;
                        document.getElementById('scoreBadge').innerText = `⭐ ${score}`;
                        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                        
                        createExplosion(s.position.x, s.position.y, s.position.z);

                        scene.remove(s);
                        stars.splice(i, 1);

                        if (stars.length === 0) {
                            currentStage++;
                            document.getElementById('stageBadge').innerText = `Stage ${currentStage}`;
                            playerPos.set(0, 1.0, 0);
                            createLevel();
                        }
                    }
                }

                // Оновлення часточок салюту
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.position.x += p.userData.vx;
                    p.position.y += p.userData.vy;
                    p.position.z += p.userData.vz;
                    p.userData.life--;
                    if (p.userData.life <= 0) {
                        scene.remove(p);
                        particles.splice(i, 1);
                    }
                }

                // Жива анімація персонажа (легке гойдання при ходьбі)
                if (moveForward || moveLeft || moveRight) {
                    playerGroup.rotation.z = Math.sin(elapsedTime * 15) * 0.1;
                } else {
                    playerGroup.rotation.z = 0;
                }

                playerGroup.position.copy(playerPos);

                // Плавне слідування камери
                camera.position.x += (playerPos.x - camera.position.x) * 0.1;
                camera.position.y += (playerPos.y + 3.0 - camera.position.y) * 0.1;
                camera.position.z += (playerPos.z + 4.5 - camera.position.z) * 0.1;
                camera.lookAt(playerPos.x, playerPos.y, playerPos.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
