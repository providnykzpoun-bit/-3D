<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Games Hub</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* --- СТИЛІ ІГРОВОГО ХАБУ --- */
        #hub-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background-color: #050510;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        header { text-align: center; padding-top: 10px; }
        h1 {
            color: #00f0ff;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        p { color: #8a8ab0; font-size: 13px; margin-top: 5px; }

        .hub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            flex-grow: 1;
            align-content: center;
        }
        .game-card {
            background: rgba(15, 15, 35, 0.8);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .game-card:active {
            transform: scale(0.95);
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; }
        .game-desc { font-size: 10px; color: #a0a0c0; text-transform: uppercase; letter-spacing: 1px; }

        footer { text-align: center; padding-bottom: 10px; font-size: 11px; color: #555577; }

        /* --- СТИЛІ 3D ГРИ --- */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        #canvas-container { width: 100%; height: 100%; }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-stats { display: flex; justify-content: space-between; align-items: center; }
        .badge {
            background: rgba(10, 10, 30, 0.7);
            border: 2px solid #00f0ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.6);
            backdrop-filter: blur(5px);
        }
        .btn-home {
            pointer-events: auto;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #ff007f;
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .controls-panel {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 12;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff007f;
            border-radius: 50%;
            font-size: 28px;
            color: #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:active { background: rgba(255, 0, 127, 0.3); transform: scale(0.92); }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            border: 3px solid #fff;
            color: #fff;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,0,127,0.6);
            text-transform: uppercase;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- ================= 1. ЕКРАН ХАБУ ================= -->
    <div id="hub-screen">
        <header>
            <h1>Cyber Game Hub</h1>
            <p>Оберіть гру та побийте свій рекорд!</p>
        </header>

        <div class="hub-grid">
            <!-- 1. Космічна стрілялка -->
            <div class="game-card" id="startSpaceGame">
                <div class="game-icon">🚀</div>
                <div class="game-title">Space Striker</div>
                <div class="game-desc">3D Екшн</div>
            </div>

            <!-- 2. Тетріс (посилання на A.html) -->
            <a href="A.html" class="game-card">
                <div class="game-icon">🧱</div>
                <div class="game-title">Neon Tetris</div>
                <div class="game-desc">Аркада</div>
            </a>

            <!-- 3. Змійка (посилання на B.html) -->
            <a href="B.html" class="game-card">
                <div class="game-icon">🐍</div>
                <div class="game-title">Cyber Snake</div>
                <div class="game-desc">Класика</div>
            </a>

            <!-- 4. Пташка (посилання на C.html) -->
            <a href="C.html" class="game-card">
                <div class="game-icon">🐦</div>
                <div class="game-title">Neon Flappy</div>
                <div class="game-desc">Реакція</div>
            </a>
        </div>

        <footer>Telegram Web App Games v1.0</footer>
    </div>


    <!-- ================= 2. 3D КОСМІЧНА СТРІЛЯЛКА ================= -->
    <div id="game-container">
        <div id="canvas-container"></div>

        <div class="hud">
            <div class="top-stats">
                <button class="btn-home" id="homeBtn">🏠 Меню</button>
                <div class="badge" id="scoreBadge">Очки: 0</div>
                <div class="badge" id="livesBadge" style="border-color: #ff007f; color: #ff007f;">❤️ 3</div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="ctrl-btn" id="leftBtn">◀</div>
            <div class="ctrl-btn" id="rightBtn">▶</div>
        </div>

        <!-- Меню програшу -->
        <div class="overlay hidden" id="gameOverMenu">
            <h1 style="color: #ff0055; text-shadow: 0 0 25px #ff0055; font-size: 30px; margin-bottom: 10px;">КОРАБЕЛЬ ЗБИТО</h1>
            <p id="finalScoreText" style="color: #a5a5c7; margin-bottom: 20px;">Ваш результат: 0 очок</p>
            <button class="btn-main" id="restartBtn">ЗНОВУ В БІЙ</button>
            <br>
            <button class="btn-home" id="exitToHubBtn" style="padding: 10px 20px; font-size: 15px; margin-top: 10px;">В Головне Меню</button>
        </div>
    </div>


    <!-- ================= 3. СКРИПТИ ================= -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
