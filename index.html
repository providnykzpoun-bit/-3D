<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Games Hub</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
        }
        header {
            text-align: center;
            padding-top: 10px;
        }
        h1 {
            color: #00f0ff;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }
        p {
            color: #8a8ab0;
            font-size: 13px;
            margin-top: 5px;
        }
        /* Сітка 2х2 для картках ігор */
        .hub-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            flex-grow: 1;
            align-content: center;
            padding: 10px 0;
        }
        .game-card {
            background: rgba(15, 15, 35, 0.8);
            border: 2px solid rgba(0, 240, 255, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: white;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        .game-card:active {
            transform: scale(0.95);
            border-color: #ff007f;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }
        .game-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .game-title {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 4px;
        }
        .game-desc {
            font-size: 10px;
            color: #a0a0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        footer {
            text-align: center;
            padding-bottom: 10px;
            font-size: 11px;
            color: #555577;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cyber Game Hub</h1>
        <p>Оберіть гру та побийте свій рекорд!</p>
    </header>

    <!-- Меню ігор 2х2 -->
    <div class="hub-grid">
        <!-- 1. Космічна стрілялка (перехід на E.html) -->
        <a href="E.html" class="game-card">
            <div class="game-icon">🚀</div>
            <div class="game-title">Space Striker</div>
            <div class="game-desc">3D Екшн</div>
        </a>

        <!-- 2. Тетріс (перехід на A.html) -->
        <a href="A.html" class="game-card">
            <div class="game-icon">🧱</div>
            <div class="game-title">Neon Tetris</div>
            <div class="game-desc">Аркада</div>
        </a>

        <!-- 3. Змійка (перехід на B.html) -->
        <a href="B.html" class="game-card">
            <div class="game-icon">🐍</div>
            <div class="game-title">Cyber Snake</div>
            <div class="game-desc">Класика</div>
        </a>

        <!-- 4. Пташка (перехід на C.html) -->
        <a href="C.html" class="game-card">
            <div class="game-icon">🐦</div>
            <div class="game-title">Neon Flappy</div>
            <div class="game-desc">Реакція</div>
        </a>
    </div>

    <footer>
        Telegram Web App Games v1.0
    </footer>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>
</body>
</html>
