<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Roblox Style 3D Obby</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #87CEEB;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* HUD Інтерфейс */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        /* Панель керування стрілками */
        .controls-panel {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 12;
            display: grid;
            grid-template-columns: 65px 65px 65px;
            grid-template-rows: 65px 65px;
            gap: 8px;
            pointer-events: auto;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid #fff;
            border-radius: 16px;
            font-size: 26px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* Кнопка стрибка справа */
        .action-buttons {
            position: absolute;
            bottom: 30px;
            right: 25px;
            z-index: 12;
            pointer-events: auto;
        }
        .jump-btn {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: 4px solid #fff;
            border-radius: 50%;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .jump-btn:active {
            transform: scale(0.92);
        }
        /* Меню */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        h1 { color: #FFD700; font-size: 36px; text-shadow: 2px 2px #000; margin-bottom: 10px; }
        p { color: #fff; font-size: 16px; margin-bottom: 25px; max-width: 300px; text-shadow: 1px 1px 1px #000; }
        .btn-main {
            background: #28a745;
            border: 3px solid #fff;
            color: #fff;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            pointer-events: auto;
        }
        .btn-main:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- HUD (Інтерфейс) -->
    <div class="hud">
        <div class="top-stats">
            <div class="badge" id="stageBadge">Stage 1</div>
            <div class="badge" id="scoreBadge">⭐ 0</div>
        </div>
    </div>

    <!-- Кнопки руху (Стрілки) -->
    <div class="controls-panel">
        <div class="ctrl-btn btn-up" id="upBtn">⬆️</div>
        <div class="ctrl-btn btn-left" id="leftBtn">⬅️</div>
        <div class="ctrl-btn btn-right" id="rightBtn">➡️</div>
    </div>

    <!-- Кнопка стрибка -->
    <div class="action-buttons">
        <button class="jump-btn" id="jumpBtn">СТРИБОК</button>
    </div>

    <!-- Головне меню -->
    <div class="overlay" id="startMenu">
        <h1>ROBLOX OBBY 3D</h1>
        <p>Використовуйте стрілки для пересування вперед і в сторони, збирайте зірки та стрибайте по платформах!</p>
        <button class="btn-main" id="startBtn">ГРАТИ</button>
    </div>

    <!-- Меню перемоги / програшу -->
    <div class="overlay hidden" id="gameOverMenu">
        <h1 id="menuTitle">ПАДІННЯ!</h1>
        <p id="menuText">Ви впали з платформи.</p>
        <button class="btn-main" id="restartBtn">ЗНОВУ</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0;
        let currentStage = 1;
        let isPlaying = false;

        // Позиція гравця та фізика
        const playerPos = new THREE.Vector3(0, 1, 0);
        let playerVelocityY = 0;
        const gravity = -0.015;
        const jumpForce = 0.32;
        let isGrounded = false;

        // Прапорці для керування стрілками
        let moveForward = false;
        let moveLeft = false;
        let moveRight = false;

        // 1. Сцена, Камера, Рендерер
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 60);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Світло
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // 2. Створення платформ (Obby світи)
        const platforms = [];
        const stars = [];

        function createLevel() {
            platforms.forEach(p => scene.remove(p));
            stars.forEach(s => scene.remove(s));
            platforms.length = 0;
            stars.length = 0;

            let zPos = 0;
            for (let i = 0; i < 20; i++) {
                const width = 3;
                const height = 0.5;
                const depth = 3;
                
                const geom = new THREE.BoxGeometry(width, height, depth);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: i % 2 === 0 ? 0x2ecc71 : 0x3498db,
                    roughness: 0.3 
                });
                const platform = new THREE.Mesh(geom, mat);

                let xPos = (i === 0) ? 0 : (Math.random() - 0.5) * 4;
                if (i === 0) zPos = 0;
                else zPos -= 4.5;

                platform.position.set(xPos, 0, zPos);
                scene.add(platform);
                platforms.push(platform);

                if (i > 0) {
                    const starGeo = new THREE.OctahedronGeometry(0.4);
                    const starMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f, emissive: 0xf1c40f, emissiveIntensity: 0.5 });
                    const star = new THREE.Mesh(starGeo, starMat);
                    star.position.set(xPos, 1.2, zPos);
                    scene.add(star);
                    stars.push(star);
                }
            }
        }

        // 3. Створення персонажа
        const playerGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.4), bodyMat);
        body.position.y = 0.5;
        playerGroup.add(body);

        const headMat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), headMat);
        head.position.y = 1.3;
        playerGroup.add(head);

        scene.add(playerGroup);

        // 4. Обробка натискань кнопок керування
        function bindButton(id, onDown, onUp) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
            btn.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
            btn.addEventListener('pointerleave', (e) => { e.preventDefault(); onUp(); });
        }

        bindButton('upBtn', () => moveForward = true, () => moveForward = false);
        bindButton('leftBtn', () => moveLeft = true, () => moveLeft = false);
        bindButton('rightBtn', () => moveRight = true, () => moveRight = false);

        // Стрибок
        document.getElementById('jumpBtn').addEventListener('click', () => {
            if (isGrounded && isPlaying) {
                playerVelocityY = jumpForce;
                isGrounded = false;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            }
        });

        // Старт гри
        function startGame() {
            score = 0;
            currentStage = 1;
            document.getElementById('scoreBadge').innerText = `⭐ ${score}`;
            document.getElementById('stageBadge').innerText = `Stage ${currentStage}`;

            playerPos.set(0, 1, 0);
            playerVelocityY = 0;
            createLevel();

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            isPlaying = true;
        }

        function gameOver(reason) {
            isPlaying = false;
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');

            document.getElementById('menuTitle').innerText = reason;
            document.getElementById('menuText').innerText = `Набрано зірок: ${score}`;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // 5. Ігровий цикл
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                const speed = 0.1;
                if (moveForward) playerPos.z -= speed;
                if (moveLeft) playerPos.x -= speed;
                if (moveRight) playerPos.x += speed;

                // Гравітація та стрибок
                playerVelocityY += gravity;
                playerPos.y += playerVelocityY;

                // Перевірка приземлення на платформи
                isGrounded = false;
                platforms.forEach(p => {
                    const pBox = new THREE.Box3().setFromObject(p);
                    if (
                        playerPos.x > pBox.min.x - 0.4 && playerPos.x < pBox.max.x + 0.4 &&
                        playerPos.z > pBox.min.z - 0.4 && playerPos.z < pBox.max.z + 0.4
                    ) {
                        if (playerPos.y >= pBox.max.y - 0.3 && playerPos.y <= pBox.max.y + 0.4 && playerVelocityY <= 0) {
                            playerPos.y = pBox.max.y;
                            playerVelocityY = 0;
                            isGrounded = true;
                        }
                    }
                });

                // Падіння у прірву
                if (playerPos.y < -10) {
                    gameOver("ПАДІННЯ!");
                }

                // Збір зірок
                for (let i = stars.length - 1; i >= 0; i--) {
                    let s = stars[i];
                    s.rotation.y += 0.05;
                    if (playerPos.distanceTo(s.position) < 1.0) {
                        score += 1;
                        document.getElementById('scoreBadge').innerText = `⭐ ${score}`;
                        if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                        scene.remove(s);
                        stars.splice(i, 1);
                    }
                }

                playerGroup.position.copy(playerPos);

                // Слідування камери за гравцем
                camera.position.x += (playerPos.x - camera.position.x) * 0.1;
                camera.position.y += (playerPos.y + 4 - camera.position.y) * 0.1;
                camera.position.z += (playerPos.z + 6 - camera.position.z) * 0.1;
                camera.lookAt(playerPos.x, playerPos.y + 1, playerPos.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
