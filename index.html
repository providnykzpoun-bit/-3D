<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Runner Telegram Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 20px 35px;
            font-size: 24px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="ui">Очки: <span id="score">0</span></div>

    <!-- Кнопки управління для смартфона -->
    <div id="controls">
        <button class="btn" id="leftBtn">⬅️</button>
        <button class="btn" id="rightBtn">➡️</button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0;
        let isGameOver = false;
        let playerTrack = 1; // 0: Ліва, 1: Центр, 2: Права
        const trackPositions = [-2, 0, 2];

        // 1. Сцена та Камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Освітлення
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Дорога (Платформа)
        const roadGeo = new THREE.PlaneGeometry(7, 100);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x16213e });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -40;
        scene.add(road);

        // 4. Гравець (Яскрава сфера)
        const playerGeo = new THREE.SphereGeometry(0.5, 32, 32);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00fff5, roughness: 0.2 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.5, 3);
        scene.add(player);

        // 5. Перешкоди та Монети
        const obstacles = [];
        const coins = [];

        function spawnObstacle() {
            if (isGameOver) return;
            const geo = new THREE.BoxGeometry(1, 1, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0xe94560 });
            const obs = new THREE.Mesh(geo, mat);
            const lane = Math.floor(Math.random() * 3);
            obs.position.set(trackPositions[lane], 0.5, -40);
            scene.add(obs);
            obstacles.push(obs);
        }

        function spawnCoin() {
            if (isGameOver) return;
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            const lane = Math.floor(Math.random() * 3);
            coin.position.set(trackPositions[lane], 0.5, -40);
            scene.add(coin);
            coins.push(coin);
        }

        setInterval(spawnObstacle, 1200);
        setInterval(spawnCoin, 800);

        // 6. Управління
        function moveLeft() {
            if (playerTrack > 0 && !isGameOver) playerTrack--;
        }
        function moveRight() {
            if (playerTrack < 2 && !isGameOver) playerTrack++;
        }

        document.getElementById('leftBtn').addEventListener('click', moveLeft);
        document.getElementById('rightBtn').addEventListener('click', moveRight);

        // Управління свайпами
        let touchStartX = 0;
        window.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
        window.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].clientX - touchStartX;
            if (diff > 30) moveRight();
            if (diff < -30) moveLeft();
        });

        // 7. Ігровий цикл (Game Loop)
        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // Плавний перехід між смугами
            player.position.x += (trackPositions[playerTrack] - player.position.x) * 0.2;
            player.rotation.x -= 0.1; // ефект кочення

            // Рух перешкод
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.position.z += 0.35; // швидкість руху

                // Перевірка зіткнення з гравцем
                if (obs.position.z > 2.5 && obs.position.z < 3.5 && Math.abs(obs.position.x - player.position.x) < 0.6) {
                    isGameOver = true;
                    alert('Game Over! Очки: ' + score);
                    location.reload();
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Рух монет
            for (let i = coins.length - 1; i >= 0; i--) {
                let coin = coins[i];
                coin.position.z += 0.35;
                coin.rotation.z += 0.05;

                // Збір монети
                if (coin.position.z > 2.5 && coin.position.z < 3.5 && Math.abs(coin.position.x - player.position.x) < 0.6) {
                    score += 10;
                    document.getElementById('score').innerText = score;
                    scene.remove(coin);
                    coins.splice(i, 1);
                } else if (coin.position.z > 10) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
