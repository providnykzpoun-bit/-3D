<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Striker 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(10, 10, 30, 0.7);
            border: 2px solid #00f0ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.6);
            backdrop-filter: blur(5px);
        }
        .btn-home {
            pointer-events: auto;
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #ff007f;
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }
        .controls-panel {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 12;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff007f;
            border-radius: 50%;
            font-size: 28px;
            color: #ff007f;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:active {
            background: rgba(255, 0, 127, 0.3);
            transform: scale(0.92);
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.9);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            border: 3px solid #fff;
            color: #fff;
            padding: 16px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255,0,127,0.6);
            text-transform: uppercase;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud">
        <div class="top-stats">
            <a href="index.html" class="btn-home">🏠 Меню</a>
            <div class="badge" id="scoreBadge">Очки: 0</div>
            <div class="badge" id="livesBadge" style="border-color: #ff007f; color: #ff007f;">❤️ 3</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="ctrl-btn" id="leftBtn">◀</div>
        <div class="ctrl-btn" id="rightBtn">▶</div>
    </div>

    <!-- Меню старту -->
    <div class="overlay" id="startMenu">
        <h1 style="color: #ff007f; font-size: 32px; margin-bottom: 10px; text-transform: uppercase;">Space Striker 3D</h1>
        <p style="color: #a5a5c7; margin-bottom: 20px; max-width: 300px;">Знищуйте ворожі кораблі та набирайте максимум очок!</p>
        <button class="btn-main" id="startBtn">ПОЧАТИ</button>
    </div>

    <!-- Меню програшу -->
    <div class="overlay hidden" id="gameOverMenu">
        <h1 style="color: #ff0055; text-shadow: 0 0 25px #ff0055; font-size: 30px; margin-bottom: 10px;">КОРАБЕЛЬ ЗБИТО</h1>
        <p id="finalScoreText" style="color: #a5a5c7; margin-bottom: 20px;">Ваш результат: 0 очок</p>
        <button class="btn-main" id="restartBtn">ЗНОВУ В БІЙ</button>
        <br>
        <a href="index.html" class="btn-home" style="padding: 10px 20px; font-size: 15px; margin-top: 10px;">В Головне Меню</a>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0;
        let lives = 3;
        let isPlaying = false;

        let shipX = 0;
        let moveLeftFlag = false;
        let moveRightFlag = false;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020208);
        scene.fog = new THREE.FogExp2(0x020208, 0.02);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // Зорі
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 400;
        const starPos = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i+=3) {
            starPos[i] = (Math.random() - 0.5) * 40;
            starPos[i+1] = (Math.random() - 0.5) * 40;
            starPos[i+2] = (Math.random() - 0.5) * 60 - 20;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starField = new THREE.Points(starsGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.15}));
        scene.add(starField);

        // Корабель
        const shipGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 4), new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.8 }));
        body.rotation.x = Math.PI / 2;
        shipGroup.add(body);
        const wings = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 0.5), new THREE.MeshStandardMaterial({ color: 0xff007f }));
        wings.position.set(0, 0, 0.3);
        shipGroup.add(wings);
        shipGroup.position.set(0, 0, 3);
        scene.add(shipGroup);

        const enemies = [];
        const lasers = [];

        function spawnEnemy() {
            if (!isPlaying) return;
            const enemy = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.5 }));
            enemy.position.set((Math.random() - 0.5) * 7, 0, -40);
            scene.add(enemy);
            enemies.push(enemy);
        }

        function shootLaser() {
            if (!isPlaying) return;
            const laser = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            laser.rotation.x = Math.PI / 2;
            laser.position.set(shipGroup.position.x, shipGroup.position.y, shipGroup.position.z - 0.5);
            scene.add(laser);
            lasers.push(laser);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        let enemyTimer, shootTimer;

        function startGame() {
            score = 0;
            lives = 3;
            shipX = 0;
            document.getElementById('scoreBadge').innerText = `Очки: ${score}`;
            document.getElementById('livesBadge').innerText = `❤️ ${lives}`;

            enemies.forEach(e => scene.remove(e));
            lasers.forEach(l => scene.remove(l));
            enemies.length = 0;
            lasers.length = 0;

            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            isPlaying = true;

            clearInterval(enemyTimer);
            clearInterval(shootTimer);
            enemyTimer = setInterval(spawnEnemy, 700);
            shootTimer = setInterval(shootLaser, 350);
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(enemyTimer);
            clearInterval(shootTimer);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            document.getElementById('finalScoreText').innerText = `Ваш результат: ${score} очок`;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function bindBtn(id, onDown, onUp) {
            const el = document.getElementById(id);
            el.addEventListener('pointerdown', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('pointerleave', (e) => { e.preventDefault(); onUp(); });
        }
        bindBtn('leftBtn', () => moveLeftFlag = true, () => moveLeftFlag = false);
        bindBtn('rightBtn', () => moveRightFlag = true, () => moveRightFlag = false);

        function animate() {
            requestAnimationFrame(animate);

            const positions = starField.geometry.attributes.position.array;
            for(let i=2; i<positions.length; i+=3) {
                positions[i] += 0.4;
                if(positions[i] > 5) positions[i] = -60;
            }
            starField.geometry.attributes.position.needsUpdate = true;

            if (isPlaying) {
                const moveSpeed = 0.12;
                if (moveLeftFlag && shipX > -3.5) shipX -= moveSpeed;
                if (moveRightFlag && shipX < 3.5) shipX += moveSpeed;

                shipGroup.position.x += (shipX - shipGroup.position.x) * 0.2;
                shipGroup.rotation.z = (shipGroup.position.x - shipX) * 0.5;

                for (let i = lasers.length - 1; i >= 0; i--) {
                    let l = lasers[i];
                    l.position.z -= 0.8;
                    if (l.position.z < -50) {
                        scene.remove(l);
                        lasers.splice(i, 1);
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let en = enemies[i];
                    en.position.z += 0.35;
                    en.rotation.x += 0.03;

                    for (let j = lasers.length - 1; j >= 0; j--) {
                        let l = lasers[j];
                        if (en.position.distanceTo(l.position) < 0.9) {
                            score += 100;
                            document.getElementById('scoreBadge').innerText = `Очки: ${score}`;
                            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                            scene.remove(en);
                            scene.remove(l);
                            enemies.splice(i, 1);
                            lasers.splice(j, 1);
                            break;
                        }
                    }

                    if (shipGroup.position.distanceTo(en.position) < 1.0) {
                        lives--;
                        document.getElementById('livesBadge').innerText = `❤️ ${lives}`;
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                        scene.remove(en);
                        enemies.splice(i, 1);
                        if (lives <= 0) gameOver();
                    } else if (en.position.z > 5) {
                        scene.remove(en);
                        enemies.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
