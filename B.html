<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Snake</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
        }

        .hud {
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .hud-btns {
            display: flex;
            gap: 6px;
        }
        .btn-hud {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #ff007f;
            border-radius: 15px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            background: rgba(10, 10, 30, 0.7);
            border: 2px solid #00f0ff;
            padding: 5px 10px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 13px;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0,240,255,0.6);
            backdrop-filter: blur(5px);
        }

        .game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        canvas#snakeCanvas {
            background: rgba(5, 5, 20, 0.9);
            border: 2px solid #00f0ff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            max-width: 90vw;
            max-height: 45vh;
        }

        .controls {
            width: 100%;
            max-width: 280px;
            padding: 5px 10px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .ctrl-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid #00f0ff;
            border-radius: 16px;
            color: #00f0ff;
            font-size: 26px;
            font-weight: bold;
            height: 55px;
            width: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: rgba(0, 240, 255, 0.4);
            transform: scale(0.92);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.93);
            backdrop-filter: blur(12px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            border: 3px solid #fff;
            color: #fff;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,0,127,0.6);
            text-transform: uppercase;
            margin-top: 10px;
        }

        .shop-box {
            width: 100%;
            max-width: 340px;
            background: rgba(15, 15, 35, 0.8);
            border: 1px solid #00f0ff;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            max-height: 55vh;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .shop-item-info { text-align: left; }
