<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cyber Snake</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020208;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .hud {
            width: 100%;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .hud-btns {
            display: flex;
            gap: 6px;
        }
        .btn-hud {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            color: #ff007f;
            border-radius: 12px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            background: rgba(10, 10, 30, 0.7);
            border: 2px solid #00f0ff;
            padding: 5px 10px;
            border-radius: 15px;
            font-weight: bold;
            font-size: 13px;
            color: #00f0ff;
            backdrop-filter: blur(5px);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        canvas#snakeCanvas {
            background: rgba(5, 5, 20, 0.9);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            width: 360px;
            height: 360px;
            max-width: 92vw;
            max-height: 92vw;
        }

        .controls {
            width: 100%;
            max-width: 300px;
            padding: 5px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .ctrl-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00f0ff;
            border-radius: 16px;
            color: #00f0ff;
            font-size: 26px;
            font-weight: bold;
            height: 55px;
            width: 85px;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .ctrl-btn:active {
            background: rgba(0, 240, 255, 0.3);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.95);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .hidden { display: none !important; }
        .btn-main {
            background: linear-gradient(45deg, #ff007f, #00f0ff);
            border: 3px solid #fff;
            color: #fff;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div class="hud-btns">
            <a href="index.html" class="btn-hud">🏠 Меню</a>
            <button class="btn-hud" id="pauseBtn">⏸️</button>
        </div>
        <div class="badge" id="scoreBadge">Довжина: 3</div>
        <div class="badge" id="coinsBadge" style="border-color: #ffd700; color: #ffd700;">🪙 0</div>
    </div>

    <div class="game-container">
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <div class="ctrl-row">
            <div class="ctrl-btn" id="upBtn">▲</div>
        </div>
        <div class="ctrl-row">
            <div class="ctrl-btn" id="leftBtn">◀</div>
            <div class="ctrl-btn" id="downBtn">▼</div>
            <div class="ctrl-btn" id="rightBtn">▶</div>
        </div>
    </div>

    <!-- Стартове меню -->
    <div class="overlay" id="startMenu">
        <h1 style="color: #ff007f; font-size: 28px; margin-bottom: 10px; text-transform: uppercase;">Cyber Snake</h1>
        <p style="color: #ffd700; font-weight: bold; font-size: 16px; margin-bottom: 20px;">Монети: <span id="coinsTotal">0</span> 🪙</p>
        <button class="btn-main" id="startBtn">ПОЧАТИ ГРУ</button>
        <a href="index.html" class="btn-hud" style="margin-top: 15px; padding: 10px 25px; font-size: 15px;">🏠 В Головне Меню</a>
    </div>

    <!-- Пауза -->
    <div class="overlay hidden" id="pauseMenu">
        <h1 style="color: #00f0ff; font-size: 30px; margin-bottom: 20px;">ПАУЗА</h1>
        <button class="btn-main" id="resumeBtn">Продовжити</button>
        <br><br>
        <a href="index.html" class="btn-hud" style="padding: 12px 25px; font-size: 16px;">🏠 В Головне Меню</a>
    </div>

    <!-- Програш -->
    <div class="overlay hidden" id="gameOverMenu">
        <h1 style="color: #ff0055; font-size: 28px; margin-bottom: 10px;">ГРУ ЗАКІНЧЕНО</h1>
        <p id="finalScoreText" style="color: #a5a5c7; margin-bottom: 5px; font-size: 16px;">Довжина: 3</p>
        <p id="earnedCoinsText" style="color: #ffd700; margin-bottom: 20px; font-weight: bold; font-size: 16px;">Зароблено: +0 🪙</p>
        <button class="btn-main" id="restartBtn">ЗНОВУ</button>
        <br><br>
        <a href="index.html" class="btn-hud" style="padding: 10px 20px; font-size: 15px; margin-top: 10px; display: inline-block;">В Головне Меню</a>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let coins = parseInt(localStorage.getItem('space_coins') || '0');
        function updateCoinsUI() {
            document.getElementById('coinsTotal').innerText = coins.toLocaleString();
            document.getElementById('coinsBadge').innerText = `🪙 ${coins}`;
        }
        updateCoinsUI();

        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 3;
        let sessionCoins = 0;
        let isPlaying = false;
        let isPaused = false;
        let gameInterval = null;

        function resetGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 3;
            sessionCoins = 0;
            spawnFood();
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) spawnFood();
            });
        }

        function main() {
            if (!isPlaying || isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                coins += 10;
                sessionCoins += 10;
                localStorage.setItem('space_coins', coins.toString());
                updateCoinsUI();
                document.getElementById('scoreBadge').innerText = `Довжина: ${score}`;
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#050514';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Їжа
            ctx.fillStyle = '#ff007f';
            ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);

            // Змійка
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#00f0ff' : '#0088cc';
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function startGame() {
            resetGame();
            isPaused = false;
            isPlaying = true;

            document.getElementById('scoreBadge').innerText = `Довжина: ${score}`;
            document.getElementById('startMenu').classList.add('hidden');
            document.getElementById('gameOverMenu').classList.add('hidden');
            document.getElementById('pauseMenu').classList.add('hidden');

            clearInterval(gameInterval);
            // Ультра-повільна швидкість (600 мс на один крок) для зручного скріншота
            gameInterval = setInterval(main, 600);
        }

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            const pauseMenu = document.getElementById('pauseMenu');
            if (isPaused) {
                pauseMenu.classList.remove('hidden');
                document.getElementById('pauseBtn').innerText = '▶';
            } else {
                pauseMenu.classList.add('hidden');
                document.getElementById('pauseBtn').innerText = '⏸️';
            }
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameInterval);
            document.getElementById('finalScoreText').innerText = `Довжина: ${score}`;
            document.getElementById('earnedCoinsText').innerText = `Зароблено: +${sessionCoins} 🪙`;
            document.getElementById('gameOverMenu').classList.remove('hidden');
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);

        document.getElementById('upBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (dy === 0) { nextDx = 0; nextDy = -1; } });
        document.getElementById('downBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (dy === 0) { nextDx = 0; nextDy = 1; } });
        document.getElementById('leftBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (dx === 0) { nextDx = -1; nextDy = 0; } });
        document.getElementById('rightBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); if (dx === 0) { nextDx = 1; nextDy = 0; } });

        draw();
    </script>
</body>
</html>
